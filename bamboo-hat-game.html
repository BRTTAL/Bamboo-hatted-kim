<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>นักรบหมวกไผ่</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#111;--paper:#f3f2ef;--red:#c4161c;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--ink);font-family:'Noto Sans Thai',system-ui,sans-serif;color:var(--ink);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{height:100%;display:flex;align-items:center;justify-content:center}
canvas{background:var(--paper);display:block}
.ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(243,242,239,.93);text-align:center;padding:20px}
.ov.on{display:flex}
h1{margin:0;font-size:clamp(34px,7vw,64px);font-weight:800;letter-spacing:.02em}
p{margin:0;max-width:34ch;line-height:1.7}
.row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
button{font:inherit;font-weight:800;border:3px solid var(--ink);background:#fff;color:var(--ink);padding:14px 28px;cursor:pointer;font-size:20px}
button:hover,button:focus-visible{background:var(--ink);color:#fff;outline:none}
button.dev,button.dev2{width:min(240px,42vw);padding:22px 10px;font-size:34px}
button.dev small,button.dev2 small{display:block;font-size:14px;font-weight:400;margin-top:6px}
button.go{border-color:var(--red);background:var(--red);color:#fff}
.bar{width:90px;height:6px;background:var(--red)}
#mb{display:none;position:fixed;inset:0;pointer-events:none}
body.m.play #mb{display:block}
#mb button{position:absolute;pointer-events:auto;border-radius:50%;padding:0;font-size:30px;opacity:.8;touch-action:none;width:78px;height:78px;bottom:calc(20px + env(safe-area-inset-bottom,0px))}
#mb button:active{background:var(--ink);color:#fff;opacity:1}
#bl{left:calc(16px + env(safe-area-inset-left,0px))}#br{left:calc(110px + env(safe-area-inset-left,0px))}
#ba{right:calc(20px + env(safe-area-inset-right,0px));width:104px!important;height:104px!important;border-color:var(--red);color:var(--red);font-size:24px!important}
#bd{right:calc(140px + env(safe-area-inset-right,0px))}
#bj{right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(138px + env(safe-area-inset-bottom,0px))!important}
#bs{right:calc(118px + env(safe-area-inset-right,0px));bottom:calc(128px + env(safe-area-inset-bottom,0px))!important;width:64px!important;height:64px!important;border-style:dashed}
#bs.rdy{background:var(--red);color:#fff;animation:pl .6s infinite alternate}
@keyframes pl{to{transform:scale(1.12)}}
#gear{display:none;position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;width:44px;height:44px;padding:0;font-size:22px;z-index:5}
body.play #gear{display:block}
#set label{display:flex;gap:12px;align-items:center;font-size:20px}
#rot{display:none;z-index:9}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div id="wrap"><canvas id="c" width="960" height="540"></canvas></div>
<div id="mb"><button id="bl" aria-label="เดินซ้าย">◀</button><button id="br" aria-label="เดินขวา">▶</button><button id="bj" aria-label="กระโดด">▲</button><button id="bd" aria-label="พุ่ง">≫</button><button id="bs" aria-label="สกิล">✦</button><button id="ba" aria-label="ฟัน/แพรี่">ฟัน</button></div>
<div class="ov on" id="sel"><h1>นักรบหมวกไผ่</h1><p>เลือกอุปกรณ์ที่ใช้เล่น เพื่อปรับปุ่มควบคุมให้เหมาะสม</p>
<div class="row"><button class="dev" data-m="mobile">Mobile<small>ปุ่มบนหน้าจอ · แนวนอน</small></button><button class="dev" data-m="pc">PC<small>เมาส์ + คีย์บอร์ด</small></button></div></div>
<button id="gear" aria-label="ตั้งค่า">⚙</button>
<div class="ov" id="mode"><h1>เลือกโหมด</h1><div class="row"><button class="dev2" data-g="story">เนื้อเรื่อง<small>3 ด่าน + Elite</small></button><button class="dev2" data-g="endless" style="font-size:26px">ไม่มีที่สิ้นสุด<small>เวฟไม่จำกัด · เก็บคะแนน</small></button></div></div>
<div class="ov" id="set"><h1>ตั้งค่า</h1><label>เสียง <input type="range" id="vol" min="0" max="100" value="60"></label><label><input type="checkbox" id="mute"> ปิดเสียง</label><div class="row"><button class="go" id="resume">เล่นต่อ</button><button id="quit">กลับเมนู</button></div></div>
<div class="ov" id="msg"><h1 id="mt"></h1><div class="bar"></div><p id="ms"></p><button class="go" id="mbtn">เริ่ม</button></div>
<div class="ov" id="rot"><h1>หมุนจอ</h1><p>หมุนโทรศัพท์เป็นแนวนอนเพื่อเล่น</p></div>
<script>
const $=s=>document.querySelector(s),C=$('#c'),X=C.getContext('2d'),W=960,H=540,G=472,INK='#111',PAPER='#f3f2ef',RED='#c4161c';
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=Math.random;
const LV=[{n:'ด่าน 1 · หมู่บ้านเงียบ',w:2200,s:4,a:2,b:1,seed:3,dens:5,d:'ศัตรูมีไม่มาก ลองฝึกจังหวะแพรี่'},
{n:'ด่าน 2 · ตลาดเก่า',w:3000,s:8,a:4,b:3,seed:11,dens:9,d:'ศัตรูมากขึ้น ใช้สิ่งกีดขวางบังลูกธนู'},
{n:'ด่าน 3 · ป้อมทราย',w:3800,s:14,a:6,b:6,seed:29,dens:13,d:'ด่านสุดท้าย ศัตรูทั้งป้อม'}];
let combo=0,ct=0,score=0,sk=0,SK=null,SL=[],J=null,endless=false,wave=0,vol=.6,muted=false,AC=null,CUR,fx=0,slow=0,Z=[],D=[],mode='pc',st='select',L=0,LW=0,cam=0,P,E,B,A,S,F,hs=0,clock=0,sid=0,endT=0,sh=0;
const K={},M={x:W/2},T={l:0,r:0,j:0};
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);C.style.width=W*s+'px';C.style.height=H*s+'px';$('#rot').classList.toggle('on',mode=='mobile'&&innerHeight>innerWidth)}
addEventListener('resize',fit);
function setSt(s){st=s;document.body.classList.toggle('play',s=='play');document.body.classList.toggle('m',mode=='mobile')}
function showMsg(t,s,b,fn){$('#mt').textContent=t;$('#ms').textContent=s;$('#mbtn').textContent=b;$('#msg').classList.add('on');setSt('msg');$('#mbtn').onclick=()=>{$('#msg').classList.remove('on');fn()};$('#mbtn').focus()}
function mk(k,x,el){const b=k=='b',w=el?(b?40:k=='a'?26:24):(b?30:22),h=el?(b?46:k=='a'?52:46):(b?30:42);return{k,el,x,y:G-h,w,h,vx:0,vy:0,hp:el?(b?2:4):k=='a'?2:1,dir:-1,st:0,tm:1+R()*1.5,fuse:-1,kn:0,alive:true,sid:-1,c:0,v:0,hold:false,ang:0,wc:0}}
function load(n,d0){L=n;const d=d0||LV[n];CUR=d;const r=rng(d.seed);LW=d.w;B=[];A=[];S=[];F=[];E=[];D=[];Z=[];fx=0;slow=0;SK=null;SL=[];cam=0;endT=0;
P={x:70,y:G-42,w:22,h:42,vx:0,vy:0,hp:3,dc:3,rt:0,dir:1,sw:0,swT:0,cd:0,dash:0,da:0,inv:0,sid:0,perf:false,kn:0,kd:1};
const nt=d.nt||n+2,tops=[];
for(let i=0;i<nt;i++){const x=750+i*(LW-1000)/nt+r()*80;B.push({x:x-110,y:G-85,w:100,h:85,t:0},{x,y:G-150,w:70,h:150,t:2});tops.push(x+35)}
const gap=(LW-700)/d.dens;
for(let i=0;i<d.dens;i++){const x=450+i*gap+r()*gap*.4;if(tops.some(t=>Math.abs(x-t)<190))continue;if(r()<.55){const w=90+r()*60,h=60+r()*50;B.push({x,y:G-h,w,h,t:0})}else{const q=38+r()*20;B.push({x,y:G-q,w:q,h:q,t:1})}}
let ai=0;
for(const[k,c]of[['s',d.s],['a',d.a],['b',d.b]])for(let i=0;i<c;i++){if(k=='a'&&ai<tops.length){const e=mk('a',tops[ai++]-11);e.y=G-150-e.h;e.hold=true;E.push(e);continue}
let x,t=0;do{x=600+R()*(LW-700);t++}while(t<40&&B.some(b=>x>b.x-50&&x<b.x+b.w+50));E.push(mk(k,x))}
const ks=['s','a','b'];for(const k of(d.el||(n<2?[ks[R()*3|0]]:ks))){let x,t=0;do{x=LW*.5+R()*LW*.45;t++}while(t<40&&B.some(b=>x>b.x-60&&x<b.x+b.w+60));E.push(mk(k,x,1))}}
function go(n){load(n);showMsg(LV[n].n,LV[n].d+(n<2?' · มี Elite 1 ตัว':' · Elite ครบทั้ง 3 ตัว'),'เริ่ม',()=>setSt('play'))}
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function mv(o,dt){if(!(o.dash>0))o.vy+=1800*dt;o.onG=false;o.blk=false;o.x+=o.vx*dt;
for(const b of B)if(ov(o,b)&&o.y+o.h>b.y+.5){if(o.vx>0||(o.vx==0&&o.x+o.w/2<b.x+b.w/2))o.x=b.x-o.w;else o.x=b.x+b.w;o.blk=true;if(o.dash>0)o.dash=0}
o.y+=o.vy*dt;for(const b of B)if(ov(o,b)){if(o.vy>=0){o.y=b.y-o.h;o.onG=true}else o.y=b.y+b.h;o.vy=0}
if(o.y+o.h>=G){o.y=G-o.h;o.vy=0;o.onG=true}o.x=Math.max(0,Math.min(LW-o.w,o.x))}
function snd(f,d,ty,v,to){if(muted||!AC||vol<=0)return;try{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=ty||'square';o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);g.gain.setValueAtTime((v||.15)*vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(_){}}
function nz(d,v,fq){if(muted||!AC||vol<=0)return;try{const n=AC.sampleRate*d|0,b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const o=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();o.buffer=b;f.type='lowpass';f.frequency.value=fq||1500;g.gain.value=v*vol;o.connect(f);f.connect(g);g.connect(AC.destination);o.start()}catch(_){}}
let nt_=0;const SC=[293.7,311.1,392,440,466.2,587.3];
function music(){if(clock<nt_)return;nt_=clock+(combo>3?.35:.7)+R()*.5;const f=SC[R()*6|0]*(R()<.3?.5:1);snd(f,1,'triangle',.06,f*.985)}
function bump(p,t,c){combo++;ct=3.5;score+=p+combo*10;J={t,c,l:1}}
function goE(){const w=wave,ks=['s','a','b'],d={n:'เวฟ '+(w+1),w:2400+Math.min(w,6)*200,s:3+w*2,a:Math.min(2+w,7),b:1+(w>>1),seed:w*7+5,dens:7+w%4,nt:Math.min(2+(w>>1),5),d:'ไม่มีที่สิ้นสุด · คะแนน '+score,el:w%3==2?[ks[R()*3|0]]:w%5==4?ks:[]};const h=P?P.hp:3;load(0,d);P.hp=w?Math.min(3,h+1):3;showMsg(d.n,d.d,'เริ่ม',()=>setSt('play'))}
function restart(){combo=0;score=0;sk=0;if(endless){wave=0;goE()}else go(L)}
function skill(){if(st!='play'||sk<100||SK)return;SK={t:0,ph:0,marks:[]};sk=0;snd(200,.5,'sawtooth',.2,900)}
function skRelease(){if(!SK||SK.ph==2)return;if(!SK.marks.length)SK.marks=E.filter(e=>e.alive).sort((a,b)=>Math.abs(a.x-P.x)-Math.abs(b.x-P.x)).slice(0,3);if(!SK.marks.length){SK=null;return}SK.ph=2;SK.q=[...SK.marks];SK.x=.3;SK.fx=P.x+11;SK.fy=P.y+21;P.inv=9}
function skillTick(rd){SK.t+=rd;
if(SK.ph<2){if(SK.ph==0&&SK.t>.6)SK.ph=1;if(SK.t>3.4||SK.marks.length>=6)skRelease();return}
SK.x-=rd;if(SK.x>0)return;SK.x=.14;const e=SK.q.shift();
if(!e){SK=null;slow=.6;P.inv=.8;return}
if(!e.alive)return;const ex=e.x+e.w/2;P.dir=R()<.5?1:-1;P.x=ex-P.dir*34-11;P.y=e.y;P.vx=P.vy=0;SL.push({x1:SK.fx,y1:SK.fy,x2:ex,y2:e.y+e.h/2,l:.4});SK.fx=ex;SK.fy=e.y+e.h/2;
if(e.el){e.hp-=2;if(e.hp<=0)die(e);else stun(e,.6)}else die(e);sh=.4;snd(900,.12,'sawtooth',.2,200);bump(150,'SLASH',RED)}
function mark(ev){if(!SK||SK.ph<1||SK.marks.length>=6)return;const r=C.getBoundingClientRect(),x=(ev.clientX-r.left)*W/r.width+cam,y=(ev.clientY-r.top)*H/r.height;let b=null,bd=80;for(const o of E)if(o.alive&&!SK.marks.includes(o)){const d=Math.hypot(o.x+o.w/2-x,o.y+o.h/2-y);if(d<bd){bd=d;b=o}}if(b){SK.marks.push(b);snd(1000,.1,'triangle',.2,1500)}}
function openSet(){if(st=='play'){setSt('pause');$('#set').classList.add('on')}else if(st=='pause')closeSet()}
function closeSet(){$('#set').classList.remove('on');setSt('play')}
function hop(e){let h=0;for(const b of B)if(e.x+e.w+4>b.x&&e.x-4<b.x+b.w&&b.y<e.y+e.h-2&&b.y+b.h>e.y)h=Math.max(h,e.y+e.h-b.y);e.vy=-Math.min(840,Math.sqrt(2*1800*(h+26)))}
function body(e,wd){const sw=Math.abs(e.vx)>10?Math.sin(e.x*.12)*.6:0,hh=e.h-30;X.fillRect(-wd/2,16,wd,hh+2);for(const q of[1,-1]){X.save();X.translate(0,16+hh);X.rotate(q*sw);X.fillRect(-3,0,6,14);X.restore()}}
function sand(x,y,n,sp,col){for(let i=0;i<n;i++){const a=R()*6.28,v=R()*sp;S.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-sp*.4,l:.7+R()*.7,m:1.4,c:col||['#111','#777','#bbb','#d6d3cc'][R()*4|0],s:2+R()*3,g:900})}}
function txt(x,y,t,c){F.push({x,y,t,c,l:1})}
function die(e){if(!e.alive)return;e.alive=false;if(!e.mini){sk=Math.min(100,sk+(e.el?35:10));bump(e.el?600:100,e.el?'ELITE DOWN':'KILL',e.el?RED:'#111')}snd(e.k=='a'?420:e.k=='b'?120:220,.15,'square',.12,60);nz(.12,.12,2500);sand(e.x+e.w/2,e.y+e.h/2,e.el?60:30,260)}
function hurt(d){if(P.inv>0)return;P.hp--;combo=0;snd(150,.25,'square',.25,50);nz(.2,.3,1200);P.inv=1.2;P.kn=.15;P.kd=d;P.vy=-300;hs=.08;sh=.3;sand(P.x+11,P.y+20,10,200,RED);if(P.hp<=0){sand(P.x+11,P.y+20,40,300);setSt('over');showMsg('พ่ายแพ้','หัวใจหมดแล้ว ลองจังหวะใหม่อีกครั้ง','ลองใหม่',restart)}}
const hbox=()=>({x:P.dir>0?P.x+P.w:P.x-70,y:P.y-12,w:70,h:P.h+14});
const aimA=()=>mode=='pc'?Math.atan2(M.y-(P.y+21),M.x+cam-(P.x+P.w/2)):(P.dir>0?0:Math.PI);
function los(x1,y1,x2,y2){const n=Math.ceil(Math.hypot(x2-x1,y2-y1)/14);for(let i=1;i<n;i++){const x=x1+(x2-x1)*i/n,y=y1+(y2-y1)*i/n;if(B.some(b=>x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h))return false}return true}
function par(){if(P.swT<.14&&!P.perf){P.perf=true;P.cd=0;slow=.8;snd(1400,.25,'triangle',.25,700);bump(300,'PERFECT',RED);fx=.25;F.push({x:P.x+11+P.dir*40,y:P.y+20,t:'',c:'ring',l:.4,r:110});snd(1760,.35,'sine',.12);sk=Math.min(100,sk+12);if(P.dc<3)P.dc++;txt(P.x,P.y-30,'แพรี่สมบูรณ์!',RED);hs=.08;sh=.2;sand(P.x+11+P.dir*40,P.y+20,12,260,RED)}else if(!P.perf){txt(P.x,P.y-30,'กัน','#111');snd(600,.1,'triangle',.15);bump(100,'GOOD','#111')}}
function stun(e,t){e.st=4;e.tm=t;e.vx=P.dir*260;e.vy=-140;sand(e.x+e.w/2,e.y+e.h/2,10,200,RED)}
function warp(e){if(e.wc>0)return;for(let i=0;i<50;i++){let x,y;const roof=R()<.5&&B.length;
if(roof){const b=B[R()*B.length|0];x=b.x+(b.w>e.w+12?6+R()*(b.w-e.w-12):0);y=b.y-e.h}else{x=100+R()*(LW-200);y=G-e.h}
const rc={x,y,w:e.w,h:e.h};if(Math.abs(x-P.x)<320||B.some(b=>ov(rc,b)))continue;
snd(1300,.3,'sine',.14,180);sand(e.x+e.w/2,e.y+e.h/2,16,250,RED);e.x=x;e.y=y;e.vx=e.vy=0;e.hold=roof;e.wc=5;sand(x+e.w/2,y+e.h/2,16,250,RED);return}}
function hitE(e){const el=e.el;snd(180,.08,'square',.15,90);nz(.08,.2,3500);sand(e.x+e.w/2,e.y+e.h/2,6,220,RED);
if(e.k=='s'){if(e.st==2){par();stun(e,.5);return}if(el&&--e.hp>0)stun(e,.4);else die(e)}
else if(e.k=='a'){if(--e.hp<=0)die(e);else{e.vx=P.dir*160;e.vy=-200;e.kn=.3;if(el){e.st=0;e.tm=1;warp(e)}}}
else if(el){if(--e.hp<=0&&e.fuse<0)e.fuse=5;e.vx=P.dir*200;e.vy=-200;e.kn=.4;hs=.04}
else{if(e.fuse<0)e.fuse=2;e.vx=P.dir*440;e.vy=-320;e.kn=.5;hs=.04}}
function wreck(b,cx,cy){nz(.35,.35,900);sand(b.x+b.w/2,b.y+b.h/2,14,150,'#bbb');const n=Math.max(2,Math.round(b.w/24)),m=Math.max(2,Math.round(b.h/24)),w=b.w/n,h=b.h/m;
for(let i=0;i<n;i++)for(let j=0;j<m;j++){const x=b.x+i*w,y=b.y+j*h,a=Math.atan2(y+h/2-cy,x+w/2-cx),v=250+R()*350;D.push({x,y,w,h,vx:Math.cos(a)*v,vy:Math.sin(a)*v-220,r:0,vr:(R()-.5)*9,l:6,c:b.t==1?'#fff':b.t==2?'#333':INK})}}
